name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target wasm32-unknown-unknown -p dmxtract_core
      - run: test "$(./scripts/wasm-source-hash.sh)" = "$(tr -d '[:space:]' < apps/web/web/wasm/source.sha256)"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-source-boundary.mjs
      - run: node --test netlify/tests/*.test.mjs

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: node --test web/*.test.mjs
      # @TestOn('browser') files (mobile_layout_test.dart,
      # test_connection_chooser_test.dart) are silently skipped by the
      # VM-platform run above — `flutter test` alone reports success without
      # ever executing them. Run them explicitly under Chrome so they
      # actually gate CI.
      - run: >-
          flutter test --platform chrome
          test/mobile_layout_test.dart
          test/test_connection_chooser_test.dart
      - run: flutter build web --release
      - run: mkdir -p build/web/schemas && cp ../../schemas/fixture-v1.json build/web/schemas/fixture-v1.json
      - run: node ../../scripts/check-static-links.mjs build/web
