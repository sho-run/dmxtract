openapi: 3.1.0
info:
  title: DMXtract Fixture Lookup API
  version: 1.0.0
  description: >-
    Privacy-minimized same-origin contract for checking whether an extracted
    fixture may already exist in an external profile library. Manuals, source
    filenames, browser identifiers, IP addresses, and provider credentials are
    not part of this contract.
paths:
  /api/fixture-matches:
    post:
      operationId: findFixtureMatches
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixtureQuery" }
      responses:
        "200":
          description: Lookup state and up to five sanitized matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixtureMatchResponse" }
        "400": { description: Invalid fixture identity }
        "413": { description: Request exceeds 4 KiB }
        "503": { description: Configured provider is unavailable }
components:
  schemas:
    FixtureQuery:
      type: object
      additionalProperties: false
      required: [manufacturer, model, modeFootprints]
      properties:
        manufacturer: { type: string, minLength: 1, maxLength: 96 }
        model: { type: string, minLength: 1, maxLength: 128 }
        modeFootprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 65535 }
    FixtureMatchResponse:
      type: object
      additionalProperties: false
      required: [enabled, matches]
      properties:
        enabled: { type: boolean }
        matches:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/FixtureMatch" }
    FixtureMatch:
      type: object
      additionalProperties: false
      required: [id, manufacturer, fixture, revision, source, score, url, modeFootprints]
      properties:
        id: { type: string, maxLength: 80 }
        manufacturer: { type: string, maxLength: 96 }
        fixture: { type: string, maxLength: 128 }
        revision: { type: string, maxLength: 96 }
        source: { type: string, enum: [manufacturer, community] }
        score: { type: number, minimum: 0, maximum: 1 }
        url: { type: string, format: uri, pattern: "^https://" }
        rating: { type: [number, "null"], minimum: 0, maximum: 5 }
        version: { type: string, maxLength: 16 }
        modeFootprints:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 65535 }
